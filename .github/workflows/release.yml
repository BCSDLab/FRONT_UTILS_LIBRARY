name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # changeset 버전 커밋·태그
  pull-requests: write # Version Packages PR 생성
  id-token: write # npm trusted publishing(OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # 대기 중인 changeset이 있으면 Version Packages PR을 만들고,
      # 그 PR이 머지되면 바뀐 버전의 패키지를 배포한다.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          pr-title: "chore: 패키지 버전 반영"
          commit-message: "chore: 패키지 버전 반영"

      - name: Notify B_BOT
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v8
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        with:
          script: |
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              ...context.repo,
              commit_sha: context.sha,
            });
            const pull = pulls[0];
            const pullRequestLink = pull?.html_url ?? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
            const pullRequestTitle = pull?.title ?? context.payload.head_commit.message.split('\n')[0];

            for (const { name, version } of JSON.parse(process.env.PUBLISHED_PACKAGES)) {
              const response = await fetch('https://api-slack.internal.bcsdlab.com/api/update-package/frontend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pullRequestLink, pullRequestTitle, packageName: name, version }),
              });
              if (!response.ok) core.warning(`${name}@${version} 배포 알림 실패: ${response.status}`);
            }
